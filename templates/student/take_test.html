{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="card"><div class="card-header"><h2>{{ test.title }}</h2>{% if test.description %}<p>{{ test.description }}</p>{% endif %}</div>
    <div class="card-body"><form method="POST" action="{{ url_for('submit_test', test_id=test.id) }}">
        {% for q in questions %}<div class="card mb-3"><div class="card-header bg-light"><strong>{{ q.text }}</strong> <span class="badge bg-info float-end">{{ q.points }} баллов</span></div><div class="card-body">
        {% for a in q.answers %}<div class="form-check"><input class="form-check-input" type="checkbox" name="question_{{ q.id }}" value="{{ a.id }}" id="q{{ q.id }}a{{ a.id }}"><label class="form-check-label" for="q{{ q.id }}a{{ a.id }}">{{ a.text }}</label></div>{% endfor %}
        </div></div>{% endfor %}
        <button type="submit" class="btn btn-success" onclick="return confirm('Отправить ответы?')">✅ Отправить</button>
        <a href="{{ url_for('student_tests') }}" class="btn btn-secondary">Отмена</a>
    </form></div></div>
</div>
{% endblock %}
