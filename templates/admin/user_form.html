{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="card">
        <div class="card-header"><h4>{% if edit_mode %}Редактирование{% else %}Добавление{% endif %} пользователя</h4></div>
        <div class="card-body">
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="POST">
                {% if not edit_mode %}
                <div class="mb-3"><label class="form-label">Логин</label><input type="text" name="username" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Пароль</label><input type="password" name="password" class="form-control" required></div>
                {% else %}
                <div class="mb-3"><label class="form-label">Логин</label><input type="text" class="form-control" value="{{ user.username }}" disabled></div>
                <div class="mb-3"><label class="form-label">Новый пароль (оставьте пустым, чтобы не менять)</label><input type="password" name="new_password" class="form-control"></div>
                {% endif %}
                <div class="mb-3"><label class="form-label">ФИО</label><input type="text" name="full_name" class="form-control" value="{{ user.full_name if user else '' }}" required></div>
                <div class="mb-3">
                    <label class="form-label">Роль</label>
                    <select name="role" class="form-control" required>
                        <option value="student" {% if user and user.role == 'student' %}selected{% endif %}>Студент</option>
                        <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Администратор</option>
                    </select>
                </div>
                <div class="mb-3"><label class="form-label">Группа (для студентов)</label><input type="text" name="group_name" class="form-control" value="{{ user.group_name if user else '' }}"></div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
